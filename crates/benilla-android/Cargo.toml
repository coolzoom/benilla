[package]
name = "benilla-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Android launcher: a NativeActivity cdylib around benilla-app, packaged by android.sh; empty on every other target"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
# The library is the APK's whole program; a host test build has nothing in it.
test = false
doctest = false

[features]
# The player build by default: `dev` bakes the build machine's checkout path in.
default = []
dev = ["benilla-app/dev"]

# Android-only, so a host `cargo build --workspace` links none of the app here.
[target.'cfg(target_os = "android")'.dependencies]
benilla-app = { path = "../benilla-app", default-features = false }
bevy = { workspace = true, features = ["android-native-activity"] }
libc = "0.2"

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }
